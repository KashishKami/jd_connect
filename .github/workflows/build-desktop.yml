name: Build and Release Desktop Apps

on:
  push:
    tags:
      - 'v*'         # Triggers automatically when you push a tag like v1.0.1
  workflow_dispatch: # Also allows manual trigger from GitHub UI (use only for testing)

permissions:
  contents: write  # Required to create GitHub Releases and upload artifacts

jobs:

  build-windows:
    name: Build Windows (.exe)
    runs-on: windows-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install

      - name: Build Tauri app
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ""
        with:
          tauriScript: bun tauri
          tagName: ${{ github.ref_name }}
          releaseName: "JD Connect ${{ github.ref_name }}"
          releaseBody: "See the release notes for this version."
          releaseDraft: true
          prerelease: false
          includeUpdaterJson: false

      - name: List bundle output (debug)
        shell: pwsh
        run: Get-ChildItem -Path "src-tauri/target/release/bundle" -Recurse | Select-Object FullName

      - name: Upload .sig files to release
        shell: pwsh
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $TAG = "${{ github.ref_name }}"
          $REPO = "${{ github.repository }}"
          Get-ChildItem -Path "src-tauri/target/release/bundle" -Recurse -Filter "*.sig" | ForEach-Object {
            Write-Host "Uploading $($_.FullName)"
            gh release upload $TAG $_.FullName --repo $REPO --clobber
          }

  build-macos:
    name: Build macOS (.dmg)
    runs-on: macos-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install

      - name: Build Tauri app
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ""
        with:
          tauriScript: bun tauri
          tagName: ${{ github.ref_name }}
          releaseName: "JD Connect ${{ github.ref_name }}"
          releaseBody: "See the release notes for this version."
          releaseDraft: true
          prerelease: false
          includeUpdaterJson: false

      - name: List bundle output (debug)
        run: find src-tauri/target/release/bundle -type f

      - name: Upload .sig files to release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG=${{ github.ref_name }}
          find src-tauri/target/release/bundle -name "*.sig" | while read sigfile; do
            echo "Uploading $sigfile"
            gh release upload "$TAG" "$sigfile" --repo ${{ github.repository }} --clobber
          done

  publish-release:
    name: Publish Release & Generate Updater JSON
    runs-on: ubuntu-latest
    needs: [build-windows, build-macos]  # Only runs after BOTH builds succeed

    steps:
      - name: Fetch release assets and build latest.json
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
          REPO: ${{ github.repository }}
        run: |
          VERSION="${TAG#v}"
          PUB_DATE=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          BASE_URL="https://github.com/${REPO}/releases/download/${TAG}"

          # Download all .sig files from the draft release
          mkdir -p ./sigs
          gh release download "$TAG" --repo "$REPO" --pattern "*.sig" --dir ./sigs

          echo "Downloaded .sig files:"
          ls ./sigs/

          # Read signatures
          MACOS_SIG=$(cat ./sigs/*.app.tar.gz.sig)
          # Windows produces either a .msi.sig or .exe.sig — use whichever exists
          WIN_SIG=$(cat ./sigs/*.msi.sig 2>/dev/null || cat ./sigs/*.exe.sig)

          # Get the actual filenames (strip .sig extension)
          MACOS_FILE=$(basename ./sigs/*.app.tar.gz.sig .sig)
          # Prefer .msi for Windows updater, fall back to .exe
          WIN_FILE=$(basename ./sigs/*.msi.sig .sig 2>/dev/null || basename ./sigs/*.exe.sig .sig)

          # Write latest.json using printf to avoid heredoc indentation issues
          printf '{\n  "version": "%s",\n  "notes": "See the release notes for this version.",\n  "pub_date": "%s",\n  "platforms": {\n    "darwin-aarch64": {\n      "signature": "%s",\n      "url": "%s/%s"\n    },\n    "windows-x86_64": {\n      "signature": "%s",\n      "url": "%s/%s"\n    }\n  }\n}\n' \
            "$VERSION" "$PUB_DATE" \
            "$MACOS_SIG" "$BASE_URL" "$MACOS_FILE" \
            "$WIN_SIG" "$BASE_URL" "$WIN_FILE" \
            > latest.json

          cat latest.json

          # Upload latest.json and publish the release
          gh release upload "$TAG" ./latest.json --repo "$REPO" --clobber
          gh release edit "$TAG" --repo "$REPO" --draft=false
