name: Build and Release Desktop Apps

on:
  push:
    tags:
      - 'v*'         # Triggers automatically when you push a tag like v1.0.1
  workflow_dispatch: # Also allows manual trigger from GitHub UI (use only for testing)

permissions:
  contents: write  # Required to create GitHub Releases and upload artifacts

jobs:

  build-windows:
    name: Build Windows (.exe)
    runs-on: windows-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install

      - name: Build Tauri app
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ""
        with:
          tauriScript: bun tauri
          tagName: ${{ github.ref_name }}
          releaseName: "JD Connect ${{ github.ref_name }}"
          releaseBody: "See the release notes for this version."
          releaseDraft: true      # Draft so the release isn't published mid-upload
          prerelease: false
          includeUpdaterJson: false  # Don't generate updater JSON yet — wait for all platforms

  build-macos:
    name: Build macOS (.dmg)
    runs-on: macos-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install

      - name: Build Tauri app
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ""
        with:
          tauriScript: bun tauri
          tagName: ${{ github.ref_name }}
          releaseName: "JD Connect ${{ github.ref_name }}"
          releaseBody: "See the release notes for this version."
          releaseDraft: true      # Draft so the release isn't published mid-upload
          prerelease: false
          includeUpdaterJson: false  # Don't generate updater JSON yet — wait for all platforms

  publish-release:
    name: Publish Release & Generate Updater JSON
    runs-on: ubuntu-latest
    needs: [build-windows, build-macos]  # Only runs after BOTH builds succeed

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Linux system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libgtk-3-dev \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf \
            libglib2.0-dev \
            libjavascriptcoregtk-4.1-dev

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install

      - name: Publish release and generate updater JSON
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ""
        with:
          tauriScript: bun tauri
          tagName: ${{ github.ref_name }}
          releaseName: "JD Connect ${{ github.ref_name }}"
          releaseBody: "See the release notes for this version."
          releaseDraft: false     # Now we publish it for real
          prerelease: false
          includeUpdaterJson: true  # All platform artifacts are already uploaded — generate JSON now
