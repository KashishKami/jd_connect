name: Build and Release Desktop Apps

on:
  push:
    tags:
      - 'v*'         # Triggers automatically when you push a tag like v1.0.1
  workflow_dispatch: # Also allows manual trigger from GitHub UI (use only for testing)

jobs:

  build-and-release:
    strategy:
      matrix:
        include:
          - platform: windows-latest
            target: x86_64-pc-windows-msvc
          - platform: macos-latest
            target: aarch64-apple-darwin

    runs-on: ${{ matrix.platform }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install

      - name: Build Tauri app
        uses: tauri-apps/tauri-action@v0
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        with:
          tauriScript: bun tauri
          tagName: ${{ github.ref_name }}
          releaseName: "Your App Name ${{ github.ref_name }}"
          releaseBody: "See the release notes for this version."
          releaseDraft: false
          prerelease: false
          includeUpdaterJson: true  # Auto-generates latest.json for the updater